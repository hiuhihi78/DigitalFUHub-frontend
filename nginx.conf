server {
    listen 80;
    root /usr/share/nginx/html;

    # React Router: unknown paths fall back to index.html
    location / {
        try_files $uri /index.html;
    }

    # Hashed build assets can be cached for a long time
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
