name: CI

# Build check only. This workflow has no secrets and never deploys.
on:
  pull_request:
  push:
    branches: [main, "2026/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      # No working tests yet - add `npm test -- --watchAll=false` here when they exist
      - name: Build
        run: npm run build
        env:
          # CRA treats lint warnings as errors when CI=true; set to true once warnings are fixed
          CI: false
          GENERATE_SOURCEMAP: false
          REACT_APP_API_BASE_URL: https://api.example.invalid/
