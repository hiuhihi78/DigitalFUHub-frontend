name: CI

# PR / branch push: build check.
# Push to main: also publish the image to ghcr.io (tag sha-<7 chars>).
# Never deploys - production is deployed from the DigitalFUHub repo.
# The image holds no settings: they come from WEB_* variables at container start (src/config.js).
on:
  pull_request:
  push:
    branches: [main, "2026/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      # No working tests yet - add `npm test -- --watchAll=false` here when they exist
      - name: Build
        run: npm run build
        env:
          # CRA treats lint warnings as errors when CI=true; set to true once warnings are fixed
          CI: false
          GENERATE_SOURCEMAP: false

  publish:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Image name
        id: meta
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          echo "ref=ghcr.io/${OWNER,,}/digitalfuhub-frontend:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.ref }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image (report only)
        uses: aquasecurity/trivy-action@0.28.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ steps.meta.outputs.ref }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

      - name: Summary
        run: echo "Published \`${{ steps.meta.outputs.ref }}\`" >> "$GITHUB_STEP_SUMMARY"
